[project]
name = "gale"
version = "0.1.0"
description = "Audio-reactive music video pipeline: real footage + GLSL effects synced to music"
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.12",
    "glfw>=2.8",
    "numpy>=2.0",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
gale-render = "gale.render:main"
gale-analyze = "gale.analyze:main"
gale-play = "gale.play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gale"]
