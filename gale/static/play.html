<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gale look</title>
<style>
  :root {
    --bg: #12110f;
    --panel: #1c1b18;
    --line: #2c2a26;
    --text: #e8e0d4;
    --mute: #8a8276;
    --accent: #c45c28;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .wrap { display: grid; grid-template-columns: 1fr minmax(280px, 26vw); height: 100%; min-height: 0; }
  .stage { display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: #0b0a09; }
  .stage .view {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .stage img, .stage video {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; display: block; background: #000;
  }
  .stage .bar { flex-shrink: 0; padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    border-top: 1px solid var(--line); }
  .side {
    min-height: 0; overflow: auto; padding: 12px 10px 32px;
    border-left: 1px solid var(--line); background: var(--bg);
  }
  body[data-kind="photo"] #btn-motion,
  body[data-kind="photo"] #btn-mute { display: none; }
  .mode { display: flex; gap: 0; border: 1px solid var(--line); }
  .mode button { border: 0; padding: 6px 10px; }
  .mode button.on,
  #btn-mute.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .side-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--mute); margin: 0; }
  .toggles { margin-left: auto; display: flex; gap: 6px; }
  .toggles button { padding: 3px 8px; font-size: 11px; color: var(--mute); }
  details.group { margin: 0 0 6px; border: 1px solid var(--line); background: var(--panel); }
  details.group.off { opacity: 0.45; }
  details.group > summary {
    list-style: none; cursor: pointer; padding: 7px 8px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); display: flex; align-items: center; gap: 8px; user-select: none;
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: "+"; color: var(--mute); width: 10px; flex-shrink: 0; }
  details.group[open] > summary::before { content: "–"; }
  details.group > summary .name { flex-shrink: 0; }
  details.group > summary .hint {
    color: var(--mute); letter-spacing: 0; text-transform: none; font-size: 11px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  details.group > summary .en {
    margin-left: auto; flex-shrink: 0; padding: 2px 8px; font-size: 10px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--mute);
  }
  details.group > summary .en.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  .group-body { padding: 4px 8px 8px; border-top: 1px solid var(--line); }
  details.group.off .group-body { pointer-events: none; }
  /* name | slider | value | props */
  .row {
    display: grid;
    grid-template-columns: 108px minmax(40px, 1fr) 40px auto;
    gap: 4px 6px;
    align-items: center;
    margin: 0 0 3px;
  }
  .row.enum { grid-template-columns: 108px 1fr; }
  .row.color { grid-template-columns: 108px auto 1fr; }
  .row input[type=color] {
    width: 36px; height: 24px; padding: 0; border: 1px solid var(--line);
    background: var(--panel); cursor: pointer;
  }
  .row input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  .row input[type=color]::-webkit-color-swatch { border: none; border-radius: 2px; }
  .row .hex {
    font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text);
    background: transparent; border: 0; width: 100%; min-width: 0;
    padding: 0; font: inherit;
  }
  .row .hex:focus { outline: none; color: var(--accent); }
  .row .label, .row > span:first-child {
    color: var(--mute); font-size: 11px; line-height: 1.2;
    overflow: hidden;
  }
  .row .label { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 4px; }
  .row .label .affects {
    display: block; font-size: 9px; opacity: 0.8; letter-spacing: 0;
    flex: 1 1 100%;
  }
  .note {
    display: none;
    width: 10px; height: 10px;
    color: var(--accent);
    flex-shrink: 0;
    vertical-align: -1px;
  }
  .row.from-score > .label > .note,
  .depth .note { display: inline-block; }
  .row.from-score > .label { color: var(--text); }
  .row output, .row .base {
    text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-size: 11px;
  }
  .row .now {
    grid-column: 1 / -1; color: var(--mute); font-size: 10px; text-align: right;
  }
  .row .now output { color: var(--accent); }
  .row input[type=range] {
    width: 100%; grid-column: auto; accent-color: var(--accent); height: 18px;
  }
  .row[hidden] { display: none; }
  .row .props {
    display: flex; gap: 3px; align-items: center; justify-content: flex-end; min-height: 22px;
  }
  .row .props button {
    padding: 2px 6px; font-size: 10px;
  }
  .row .props button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row .bind-extra {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    padding: 0 0 2px 114px;
  }
  .row .bind-extra[hidden] { display: none; }
  .row .bind-extra select {
    width: auto; min-width: 88px; padding: 2px 4px; font-size: 10px;
  }
  .row .bind-extra .depth {
    display: flex; align-items: center; gap: 4px; color: var(--mute); font-size: 10px; flex: 1 1 100px;
  }
  .row .bind-extra .depth input[type=range] { flex: 1; min-width: 60px; }
  .row .bind-extra .depth output { min-width: 32px; text-align: right; color: var(--text); }
  select {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); padding: 4px 6px; font: inherit; font-size: 11px;
  }
  select#clip { width: auto; max-width: 220px; flex: 1 1 140px; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.45; cursor: default; }
  .status { color: var(--mute); font-size: 12px; margin-left: auto; }
  input[type=number] {
    width: 72px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); padding: 4px 6px; font: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="view">
      <img id="still" alt="preview" />
      <video id="motion" controls loop playsinline style="display:none"></video>
    </div>
    <div class="bar">
      <div class="mode" id="mode">
        <button type="button" data-kind="video" class="on">Video</button>
        <button type="button" data-kind="photo">Photo</button>
      </div>
      <select id="clip" title="source"></select>
      <label>t <input id="time" type="number" min="0" step="0.1" value="2" /></label>
      <button id="btn-still">Frame</button>
      <button id="btn-keep">Keep</button>
      <button id="btn-motion" class="primary">Loop 4s</button>
      <button id="btn-mute" type="button" title="Mute music">Mute</button>
      <button id="btn-save">Save YAML</button>
      <span class="status" id="status">loading…</span>
    </div>
  </div>
  <div class="side">
    <div class="side-head">
      <h1>look</h1>
      <div class="toggles">
        <button id="btn-expand" type="button">all</button>
        <button id="btn-collapse" type="button">none</button>
      </div>
    </div>
    <div id="sliders"></div>
  </div>
</div>
<script>
const still = document.getElementById("still");
const motion = document.getElementById("motion");
const status = document.getElementById("status");
const timeInput = document.getElementById("time");
const slidersRoot = document.getElementById("sliders");
const clipSelect = document.getElementById("clip");

let look = {};
let timer = null;
let previewing = false;
let mediaKind = "video";
let allClips = [];
let currentSource = "";
let schema = [];
let presets = { grade: {} };
let sectionAttr = {
  Overlay: "overlay",
  Geo: "geo",
  Grade: "grade",
  Flow: "flow",
  Trails: "trails",
  Glow: "glow",
  Grain: "grain",
  Halftone: "halftone",
  CRT: "crt",
  Slice: "slice",
};
const nowOutputs = {};

const AUTO_SHAPES = ["increasing", "decreasing", "wave"];
const MOD_SOURCES = ["rms", "low", "mid", "high", "energy", "beat", "onset", "kick"];

function ensureBindings() {
  if (!Array.isArray(look.bindings)) look.bindings = [];
}

function getBinding(path) {
  ensureBindings();
  return look.bindings.find((b) => b.path === path) || null;
}

function setBinding(path, patch) {
  ensureBindings();
  let b = look.bindings.find((x) => x.path === path);
  if (!b) {
    b = { path, automation: "none", modulate: "none", depth: 0 };
    look.bindings.push(b);
  }
  Object.assign(b, patch);
  if (b.automation === "none" && b.modulate === "none") {
    look.bindings = look.bindings.filter((x) => x.path !== path);
  }
}

function applyResolved(resolved) {
  if (!resolved) return;
  for (const [path, value] of Object.entries(resolved)) {
    const el = nowOutputs[path];
    if (el) el.textContent = Number(value).toFixed(3);
  }
}

function sectionEnabled(group) {
  const attr = sectionAttr[group];
  if (!attr || !look[attr]) return true;
  return look[attr].enabled !== false;
}

function setSectionEnabled(group, on) {
  const attr = sectionAttr[group];
  if (!attr) return;
  if (!look[attr]) look[attr] = {};
  look[attr].enabled = !!on;
  // Mode-based sections: off clears mode so nothing is “armed” while disabled.
  if (!on && (attr === "geo" || attr === "overlay") && "mode" in look[attr]) {
    look[attr].mode = "none";
  }
}

function clearModeUI(details, group) {
  const attr = sectionAttr[group];
  if (attr !== "geo" && attr !== "overlay") return;
  const modeSelect = details.querySelector('.row.enum select');
  if (modeSelect) modeSelect.value = "none";
  const hint = details.querySelector("summary .hint");
  if (hint) hint.textContent = "none";
}

function getPath(obj, path) {
  return path.split(".").reduce((o, k) => o[k], obj);
}
function setPath(obj, path, value) {
  const keys = path.split(".");
  const last = keys.pop();
  const parent = keys.reduce((o, k) => o[k], obj);
  parent[last] = value;
}

const MUTE_KEY = "gale-mute";
const btnMute = document.getElementById("btn-mute");

function musicMuted() {
  return localStorage.getItem(MUTE_KEY) === "1";
}

function applyMute(muted) {
  motion.muted = !!muted;
  btnMute.classList.toggle("on", !!muted);
  btnMute.textContent = muted ? "Muted" : "Mute";
}

function setMusicMuted(muted) {
  localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
  applyMute(muted);
}

function showStill() {
  motion.pause();
  motion.style.display = "none";
  still.style.display = "block";
}
function showMotion(url) {
  still.style.display = "none";
  motion.style.display = "block";
  motion.muted = musicMuted();
  motion.src = url;
  motion.play();
}

function fillClips(clips, source, kind) {
  const filtered = (clips || []).filter((c) => !kind || c.kind === kind);
  clipSelect.innerHTML = filtered.map((c) => {
    const sel = c.path === source ? " selected" : "";
    return `<option value="${c.path}"${sel}>${c.name}</option>`;
  }).join("");
}

function applyClipMeta(data) {
  allClips = data.clips || [];
  mediaKind = data.kind || "video";
  currentSource = data.source || "";
  document.body.dataset.kind = mediaKind;
  document.querySelectorAll("#mode button").forEach((b) => {
    b.classList.toggle("on", b.dataset.kind === mediaKind);
  });
  timeInput.max = Math.max(data.duration, 0.1).toFixed(1);
  const t = parseFloat(timeInput.value) || 0;
  if (t > data.duration) timeInput.value = (data.duration * 0.2).toFixed(1);
  fillClips(allClips, data.source, mediaKind);
}

function setMediaKind(kind) {
  if (kind === mediaKind) return;
  mediaKind = kind;
  document.body.dataset.kind = kind;
  document.querySelectorAll("#mode button").forEach((b) => {
    b.classList.toggle("on", b.dataset.kind === kind);
  });
  fillClips(allClips, currentSource, kind);
  const options = [...clipSelect.options].map((o) => o.value);
  if (!options.length) {
    status.textContent = "no " + kind + "s in assets/";
    return;
  }
  if (!options.includes(clipSelect.value)) {
    clipSelect.value = options[0];
  }
  if (clipSelect.value === currentSource) return;
  changeClip();
}

async function changeClip() {
  const path = clipSelect.value;
  status.textContent = "loading clip…";
  clipSelect.disabled = true;
  const res = await fetch("/api/source", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path, look }),
  });
  clipSelect.disabled = false;
  if (!res.ok) {
    status.textContent = await res.text();
    return;
  }
  const data = await res.json();
  applyClipMeta(data);
  showStill();
  fetchFrame();
  status.textContent = data.source.split("/").pop();
}

function storageKey(name) { return "gale-open-" + name; }
function isOpen(name, fallback) {
  const v = localStorage.getItem(storageKey(name));
  if (v === null) return !!fallback;
  return v === "1";
}
function setOpen(name, open) {
  localStorage.setItem(storageKey(name), open ? "1" : "0");
}

function groupHint(name) {
  const key = name.toLowerCase();
  const block = look[key];
  if (!block) return "";
  if (typeof block.mode === "string") return block.mode;
  if (typeof block.axis === "string") return block.axis;
  if (key === "grade" && typeof block.preset === "string" && block.preset !== "custom") {
    return block.preset;
  }
  return "";
}

function applyGradePreset(name) {
  if (!look.grade) look.grade = {};
  if (name === "custom") {
    look.grade.preset = "custom";
    return;
  }
  const recipe = (presets.grade || {})[name];
  if (!recipe) {
    look.grade.preset = "custom";
    return;
  }
  look.grade.preset = name;
  look.grade.contrast = recipe.contrast;
  look.grade.saturation = recipe.saturation;
  look.grade.crush = recipe.crush;
  look.grade.shadow_tint = (recipe.shadow_tint || []).slice();
  look.grade.highlight_tint = (recipe.highlight_tint || []).slice();
  look.grade.enabled = true;
}

function markGradeCustom() {
  if (!look.grade) return;
  if (look.grade.preset && look.grade.preset !== "custom") {
    look.grade.preset = "custom";
    const sel = document.querySelector('[data-path="grade.preset"] select');
    if (sel) sel.value = "custom";
    const hint = document.querySelector('details.group .name')
      && [...document.querySelectorAll("details.group")].find((d) => d.querySelector(".name")?.textContent === "Grade")
        ?.querySelector("summary .hint");
    if (hint) hint.remove();
  }
}

function isAudioSlider(s) {
  return !!(s && (s.audio || (typeof s.path === "string" && s.path.endsWith("_mod"))));
}

function soundtrackLive(path) {
  const binding = getBinding(path);
  if (binding && binding.modulate && binding.modulate !== "none") return true;
  if (String(path).endsWith("_mod")) return true;
  const sibling = getPath(look, path + "_mod");
  return !!(Number(sibling) || 0);
}

function syncSoundtrackMarks() {
  document.querySelectorAll(".row[data-path]").forEach((row) => {
    const path = row.dataset.path;
    const live = row.dataset.audio === "1" || soundtrackLive(path);
    row.classList.toggle("from-score", live);
    const note = row.querySelector(":scope > .label > .note");
    if (note) {
      note.hidden = !live;
      note.setAttribute("aria-hidden", live ? "false" : "true");
    }
  });
}

function noteIcon() {
  return `<svg class="note" viewBox="0 0 12 12" focusable="false" aria-hidden="true">
    <title>Soundtrack</title>
    <path fill="currentColor" d="M8.6 1.1v6.4a2.2 2.2 0 1 1-.95-1.8V3L4.1 4.05v4.75a2.2 2.2 0 1 1-.95-1.8V2.5L8.6 1.1z"/>
  </svg>`;
}

function labelCell(s) {
  const modesText = s.modes ? String(s.modes).replaceAll("/", "/\u200b") : "";
  const modes = modesText ? `<span class="affects">${modesText}</span>` : "";
  const title = s.modes ? `${s.label} (${s.modes})` : s.label;
  return `<span class="label" title="${title}">${noteIcon()}<span class="name">${s.label}</span>${modes}</span>`;
}

function rgbToHex(rgb) {
  const arr = Array.isArray(rgb) ? rgb : [1, 1, 1];
  const toByte = (v) => Math.max(0, Math.min(255, Math.round(Number(v) * 255)));
  return "#" + [0, 1, 2].map((i) => toByte(arr[i] ?? 1).toString(16).padStart(2, "0")).join("");
}

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [
    ((n >> 16) & 255) / 255,
    ((n >> 8) & 255) / 255,
    (n & 255) / 255,
  ];
}

function renderColorRow(s, val) {
  const row = document.createElement("div");
  row.className = "row color";
  row.dataset.path = s.path;
  const hex = rgbToHex(val);
  row.innerHTML = `
    ${labelCell(s)}
    <input type="color" value="${hex}" title="Pick color" />
    <input class="hex" type="text" value="${hex}" spellcheck="false" maxlength="7" />
  `;
  const picker = row.querySelector('input[type=color]');
  const hexInput = row.querySelector(".hex");

  function commit(nextHex) {
    const rgb = hexToRgb(nextHex);
    if (!rgb) {
      hexInput.value = rgbToHex(getPath(look, s.path));
      return;
    }
    const normalized = "#" + nextHex.replace(/^#/, "").toLowerCase();
    picker.value = normalized;
    hexInput.value = normalized;
    setPath(look, s.path, rgb);
    if (s.path.startsWith("grade.")) markGradeCustom();
    showStill();
    scheduleFrame();
  }

  picker.addEventListener("input", () => commit(picker.value));
  hexInput.addEventListener("change", () => commit(hexInput.value));
  hexInput.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") {
      ev.preventDefault();
      commit(hexInput.value);
      hexInput.blur();
    }
  });
  return row;
}

function renderSliders(schemaIn) {
  schema = schemaIn || schema;
  slidersRoot.innerHTML = "";
  let group = null, body = null, details = null;
  for (const s of schema) {
    if (s.group !== group) {
      group = s.group;
      const groupName = group;
      details = document.createElement("details");
      const detailsEl = details;
      detailsEl.className = "group";
      detailsEl.open = isOpen(groupName, s.open);
      const enabled = sectionEnabled(groupName);
      detailsEl.classList.toggle("off", !enabled);
      detailsEl.addEventListener("toggle", () => setOpen(groupName, detailsEl.open));
      const summary = document.createElement("summary");
      const hint = groupHint(groupName);
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = groupName;
      summary.appendChild(name);
      if (hint) {
        const h = document.createElement("span");
        h.className = "hint";
        h.textContent = hint;
        summary.appendChild(h);
      }
      const en = document.createElement("button");
      en.type = "button";
      en.className = "en" + (enabled ? " on" : "");
      en.textContent = enabled ? "on" : "off";
      en.title = "Enable section";
      en.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        const on = !en.classList.contains("on");
        en.classList.toggle("on", on);
        en.textContent = on ? "on" : "off";
        detailsEl.classList.toggle("off", !on);
        setSectionEnabled(groupName, on);
        if (!on) clearModeUI(detailsEl, groupName);
        showStill();
        scheduleFrame();
      });
      summary.appendChild(en);
      detailsEl.appendChild(summary);
      body = document.createElement("div");
      body.className = "group-body";
      detailsEl.appendChild(body);
      slidersRoot.appendChild(detailsEl);
    }
    const val = getPath(look, s.path);
    if (s.type === "enum") {
      const row = document.createElement("div");
      row.className = "row enum";
      row.dataset.path = s.path;
      const opts = (s.options || []).map((opt) => {
        const sel = opt === val ? " selected" : "";
        return `<option value="${opt}"${sel}>${opt}</option>`;
      }).join("");
      row.innerHTML = `${labelCell(s)}<select>${opts}</select>`;
      row.querySelector("select").addEventListener("change", (ev) => {
        setPath(look, s.path, ev.target.value);
        if (s.path === "grade.preset") {
          applyGradePreset(ev.target.value);
          renderSliders(schema);
          showStill();
          scheduleFrame();
          return;
        }
        if (s.path.endsWith(".mode") || s.path.endsWith(".axis")) {
          const sum = row.closest("details").querySelector("summary .hint")
            || (() => { const h = document.createElement("span"); h.className = "hint"; row.closest("details").querySelector("summary .name").after(h); return h; })();
          sum.textContent = ev.target.value;
        }
        // Picking a mode turns the section back on.
        const attr = sectionAttr[s.group];
        if (attr && look[attr] && ev.target.value !== "none") {
          look[attr].enabled = true;
          const detailsEl = row.closest("details");
          detailsEl.classList.remove("off");
          const enBtn = detailsEl.querySelector("summary .en");
          if (enBtn) { enBtn.classList.add("on"); enBtn.textContent = "on"; }
        }
        showStill();
        scheduleFrame();
        syncSliceColorControls();
      });
      body.appendChild(row);
    } else if (s.type === "toggle") {
      const row = document.createElement("div");
      row.className = "row enum";
      row.dataset.path = s.path;
      const on = val !== false;
      row.innerHTML = `${labelCell(s)}<span class="props"><button type="button" class="${on ? "on" : ""}">${on ? "on" : "off"}</button></span>`;
      const btn = row.querySelector("button");
      btn.addEventListener("click", () => {
        const next = !btn.classList.contains("on");
        btn.classList.toggle("on", next);
        btn.textContent = next ? "on" : "off";
        setPath(look, s.path, next);
        syncSliceColorControls();
        showStill();
        scheduleFrame();
      });
      body.appendChild(row);
    } else if (s.type === "color") {
      body.appendChild(renderColorRow(s, val));
    } else if (s.bindable) {
      body.appendChild(renderBindableRow(s, val));
    } else {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.path = s.path;
      if (isAudioSlider(s)) row.dataset.audio = "1";
      row.innerHTML = `
        ${labelCell(s)}
        <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${val}" />
        <output>${Number(val).toFixed(3)}</output>
        <span class="props"></span>
      `;
      const input = row.querySelector("input");
      const out = row.querySelector("output");
      input.addEventListener("input", () => {
        const v = parseFloat(input.value);
        out.textContent = v.toFixed(3);
        setPath(look, s.path, v);
        if (s.path.startsWith("grade.")) markGradeCustom();
        syncSoundtrackMarks();
        showStill();
        scheduleFrame();
      });
      body.appendChild(row);
    }
  }
  syncSoundtrackMarks();
  syncSliceColorControls();
}

function syncSliceColorControls() {
  const slice = look.slice || {};
  const horizontal = slice.axis === "horizontal";
  const colorOn = slice.color !== false;
  const toggle = document.querySelector('[data-path="slice.color"]');
  if (toggle) toggle.hidden = !horizontal;
  const showSplit = !horizontal || colorOn;
  document.querySelectorAll('[data-path="slice.split"], [data-path="slice.colors"]').forEach((row) => {
    row.hidden = !showSplit;
  });
}

function renderBindableRow(s, val) {
  const binding = getBinding(s.path) || { automation: "none", modulate: "none", depth: 0 };
  const autoOn = binding.automation && binding.automation !== "none";
  const modOn = binding.modulate && binding.modulate !== "none";
  const row = document.createElement("div");
  row.className = "row bindable";
  row.dataset.path = s.path;

  const autoOpts = AUTO_SHAPES.map((opt) => {
    const sel = opt === (autoOn ? binding.automation : "increasing") ? " selected" : "";
    return `<option value="${opt}"${sel}>${opt}</option>`;
  }).join("");
  const modOpts = MOD_SOURCES.map((opt) => {
    const sel = opt === (modOn ? binding.modulate : "energy") ? " selected" : "";
    return `<option value="${opt}"${sel}>${opt}</option>`;
  }).join("");
  const depth = Number(binding.depth || 0);
  const showExtra = autoOn || modOn;

  row.innerHTML = `
    ${labelCell(s)}
    <input class="base-range" type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${val}" />
    <output class="base">${Number(val).toFixed(3)}</output>
    <span class="props">
      <button type="button" class="auto-btn${autoOn ? " on" : ""}">A</button>
      <button type="button" class="mod-btn${modOn ? " on" : ""}" title="Soundtrack">M</button>
    </span>
    <span class="now">now <output class="now-val">${Number(val).toFixed(3)}</output></span>
    <div class="bind-extra"${showExtra ? "" : " hidden"}>
      <select class="auto-shape"${autoOn ? "" : " hidden"}>${autoOpts}</select>
      <select class="mod-source"${modOn ? "" : " hidden"}>${modOpts}</select>
      <label class="depth"${modOn ? "" : " hidden"}>
        ${noteIcon()}
        Str
        <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${depth}" />
        <output>${depth.toFixed(3)}</output>
      </label>
    </div>
  `;

  const baseOut = row.querySelector(".base");
  const nowOut = row.querySelector(".now-val");
  nowOutputs[s.path] = nowOut;
  const baseRange = row.querySelector(".base-range");
  const autoBtn = row.querySelector(".auto-btn");
  const autoShape = row.querySelector(".auto-shape");
  const modBtn = row.querySelector(".mod-btn");
  const modSource = row.querySelector(".mod-source");
  const depthWrap = row.querySelector(".depth");
  const depthInput = depthWrap.querySelector("input");
  const depthOut = depthWrap.querySelector("output");
  const extra = row.querySelector(".bind-extra");

  function syncExtra() {
    const a = autoBtn.classList.contains("on");
    const m = modBtn.classList.contains("on");
    extra.hidden = !(a || m);
    autoShape.hidden = !a;
    modSource.hidden = !m;
    depthWrap.hidden = !m;
  }

  function syncBinding() {
    const next = {
      automation: autoBtn.classList.contains("on") ? autoShape.value : "none",
      modulate: modBtn.classList.contains("on") ? modSource.value : "none",
      depth: modBtn.classList.contains("on") ? parseFloat(depthInput.value) || 0 : 0,
    };
    setBinding(s.path, next);
    syncExtra();
    syncSoundtrackMarks();
    showStill();
    scheduleFrame();
  }

  baseRange.addEventListener("input", () => {
    const v = parseFloat(baseRange.value);
    baseOut.textContent = v.toFixed(3);
    setPath(look, s.path, v);
    showStill();
    scheduleFrame();
  });

  autoBtn.addEventListener("click", () => {
    autoBtn.classList.toggle("on");
    syncBinding();
  });
  autoShape.addEventListener("change", syncBinding);

  modBtn.addEventListener("click", () => {
    modBtn.classList.toggle("on");
    syncBinding();
  });
  modSource.addEventListener("change", syncBinding);
  depthInput.addEventListener("input", () => {
    depthOut.textContent = parseFloat(depthInput.value).toFixed(3);
    syncBinding();
  });

  return row;
}

function scheduleFrame() {
  clearTimeout(timer);
  timer = setTimeout(fetchFrame, 120);
}

async function fetchFrame() {
  if (previewing) return;
  status.textContent = "rendering frame…";
  const res = await fetch("/api/frame", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ look, t: parseFloat(timeInput.value) || 0 }),
  });
  if (!res.ok) {
    status.textContent = await res.text();
    return;
  }
  const resolvedHeader = res.headers.get("X-Gale-Resolved");
  if (resolvedHeader) {
    try { applyResolved(JSON.parse(resolvedHeader)); } catch (_) {}
  }
  const blob = await res.blob();
  still.src = URL.createObjectURL(blob);
  status.textContent = "frame";
}

async function fetchMotion() {
  previewing = true;
  document.getElementById("btn-motion").disabled = true;
  status.textContent = "rendering 4s loop…";
  const t = parseFloat(timeInput.value) || 0;
  const res = await fetch("/api/preview", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ look, t, duration: 4 }),
  });
  previewing = false;
  document.getElementById("btn-motion").disabled = false;
  if (!res.ok) {
    status.textContent = await res.text();
    return;
  }
  showMotion("/media/preview.mp4?t=" + Date.now());
  status.textContent = "loop";
}

async function saveLook() {
  const res = await fetch("/api/look", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(look),
  });
  status.textContent = res.ok ? "saved configs/look.yaml" : await res.text();
}

async function keepStill() {
  status.textContent = "keeping…";
  const res = await fetch("/api/export", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ look, t: parseFloat(timeInput.value) || 0 }),
  });
  if (!res.ok) {
    status.textContent = await res.text();
    return;
  }
  const data = await res.json();
  showStill();
  const size = data.width && data.height ? " " + data.width + "×" + data.height : "";
  status.textContent = "kept " + data.name + size;
}

document.getElementById("btn-still").onclick = () => { showStill(); fetchFrame(); };
document.getElementById("btn-keep").onclick = () => { showStill(); keepStill(); };
document.getElementById("btn-motion").onclick = fetchMotion;
document.getElementById("btn-save").onclick = saveLook;
btnMute.onclick = () => setMusicMuted(!motion.muted);
motion.addEventListener("volumechange", () => {
  const muted = motion.muted || motion.volume === 0;
  if ((localStorage.getItem(MUTE_KEY) === "1") === muted) return;
  localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
  btnMute.classList.toggle("on", muted);
  btnMute.textContent = muted ? "Muted" : "Mute";
});
applyMute(musicMuted());
document.addEventListener("keydown", (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tag = (ev.target && ev.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  if (ev.key === "k" || ev.key === "K") {
    ev.preventDefault();
    keepStill();
  }
});
  document.getElementById("btn-expand").onclick = () => {
  document.querySelectorAll("details.group").forEach((d) => {
    d.open = true;
    setOpen(d.querySelector("summary .name").textContent, true);
  });
};
document.getElementById("btn-collapse").onclick = () => {
  document.querySelectorAll("details.group").forEach((d) => {
    d.open = false;
    setOpen(d.querySelector("summary .name").textContent, false);
  });
};
clipSelect.addEventListener("change", changeClip);
document.querySelectorAll("#mode button").forEach((b) => {
  b.addEventListener("click", () => setMediaKind(b.dataset.kind));
});
timeInput.addEventListener("change", () => { showStill(); fetchFrame(); });

(async () => {
  const res = await fetch("/api/state");
  const data = await res.json();
  look = data.look;
  if (data.sections) sectionAttr = data.sections;
  if (data.presets) presets = data.presets;
  ensureBindings();
  applyClipMeta(data);
  renderSliders(data.schema);
  fetchFrame();
})();
</script>
</body>
</html>
